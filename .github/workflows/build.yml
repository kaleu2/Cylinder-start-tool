name: Build

on:
  workflow_dispatch:        # manuell starten: Actions -> Build -> Run workflow
  push:
    tags: ["v*"]            # bei einem Tag wie v1.0.0 wird zusätzlich ein Release erzeugt

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Zylinderabflug_Tool.exe
          - os: ubuntu-latest
            artifact: Zylinderabflug_Tool
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tkinter unter Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Abhängigkeiten
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller

      - name: Bauen
        run: python -m PyInstaller --onefile --windowed --name Zylinderabflug_Tool zylinderabflug_tool.py

      - uses: actions/upload-artifact@v4
        with:
          name: Zylinderabflug_Tool-${{ runner.os }}
          path: dist/${{ matrix.artifact }}

      - name: Release-Datei anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
